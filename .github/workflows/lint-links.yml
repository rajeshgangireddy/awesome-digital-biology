name: Lint Links

on:
  pull_request:
    paths:
      - '**/*.md'
  schedule:
    # Weekly check for dead links, Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,307,308,429
            README.md docs/**/*.md
          fail: false

      - name: Awesome Lint
        continue-on-error: true
        run: |
          npm install -g awesome-lint || true
          npx awesome-lint || true
